name: Build CloudRedirect Windows

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - master
    tags:
      - "v*"

  pull_request:

permissions:
  contents: write

concurrency:
  group: cloudredirect-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Build Windows release
    runs-on: windows-2022
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
          submodules: recursive

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~\.nuget\packages
          key: nuget-${{ runner.os }}-${{ hashFiles('ui/**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Configure CMake
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          cmake `
            -S . `
            -B build-win `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DCR_GIT_SHA="$env:GITHUB_SHA"

      - name: Build native Windows targets
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          cmake `
            --build build-win `
            --config Release `
            --target cloud_redirect cloud_redirect_cli cloud760_tool `
            --parallel

      - name: Check WPF native dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $required = @(
            "ui\native\steam_api.dll",
            "build-win\Release\cloud760_tool.exe"
          )

          $missing = @(
            $required | Where-Object {
              -not (Test-Path -LiteralPath $_)
            }
          )

          if ($missing.Count -gt 0) {
            Write-Host "Required WPF files are missing:"

            $missing | ForEach-Object {
              Write-Host " - $_"
            }

            Write-Error "Cannot build CloudRedirect.exe without the required WPF resources."
          }

      - name: Copy cloud760 helper into WPF resources
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path "ui\native" |
            Out-Null

          Copy-Item `
            -LiteralPath "build-win\Release\cloud760_tool.exe" `
            -Destination "ui\native\cloud760_tool.exe" `
            -Force

      - name: Build CloudRedirect WPF application
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          cmake `
            --build build-win `
            --config Release `
            --target ui `
            --parallel

      - name: Prepare release files
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path "release-files" |
            Out-Null

          $outputs = @(
            @{
              Source = "ui\bin\publish\CloudRedirect.exe"
              Name = "CloudRedirect.exe"
            },
            @{
              Source = "build-win\Release\cloud_redirect.dll"
              Name = "cloud_redirect.dll"
            }
          )

          foreach ($output in $outputs) {
            if (-not (Test-Path -LiteralPath $output.Source)) {
              Write-Error "Build output was not found: $($output.Source)"
            }

            Copy-Item `
              -LiteralPath $output.Source `
              -Destination "release-files\$($output.Name)" `
              -Force
          }

          foreach ($file in Get-ChildItem -LiteralPath "release-files" -File) {
            $hash = (
              Get-FileHash `
                -Algorithm SHA256 `
                -LiteralPath $file.FullName
            ).Hash.ToLowerInvariant()

            "$hash  $($file.Name)" |
              Set-Content `
                -LiteralPath "$($file.FullName).sha256" `
                -NoNewline

            Add-Content `
              -LiteralPath "$($file.FullName).sha256" `
              -Value ""
          }

          Write-Host "Release files:"
          Get-ChildItem -LiteralPath "release-files" -File |
            Select-Object Name, Length

      - name: Upload Windows workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: CloudRedirect-windows
          if-no-files-found: error
          retention-days: 7
          path: |
            release-files\CloudRedirect.exe
            release-files\CloudRedirect.exe.sha256
            release-files\cloud_redirect.dll
            release-files\cloud_redirect.dll.sha256

  release:
    name: Publish GitHub release
    needs:
      - windows
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04

    steps:
      - name: Download Windows build artifact
        uses: actions/download-artifact@v4
        with:
          name: CloudRedirect-windows
          path: release-files

      - name: List release files
        shell: bash
        run: |
          set -euxo pipefail
          find release-files -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: CloudRedirect ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release-files/CloudRedirect.exe
            release-files/CloudRedirect.exe.sha256
            release-files/cloud_redirect.dll
            release-files/cloud_redirect.dll.sha256
